services:
  web:
    build:
      context: .
      dockerfile: src/MaleFashion.Web/Dockerfile
    image: malefashion
    env_file:
      - src/MaleFashion.Web/web.env
    volumes:
      - malefashion-data:/app/Logs/
    ports:
      - "8000:80"
    entrypoint: ["dotnet", "MaleFashion.Web.dll"]

volumes:
  malefashion-data:
    external: true
